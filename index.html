<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trianglute</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

</head>
<body class="bg-light">

    <div class="container mt-5">
        <h1>Hello World: Trianglute</h1>

        <!-- Search input and dropdown container -->
        <div class="position-relative mb-4">
            <input type="text" id="search-input" class="form-control" placeholder="Start typing an address..." autocomplete="off" />
            <ul id="results-dropdown" class="list-group position-absolute w-100 shadow-sm" style="display: none; z-index: 1000; max-height: 200px; overflow-y: auto;"></ul>
        </div>

        <!-- Saved Addresses Section -->
        <div class="card shadow-sm">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0">Saved Addresses</h5>
                <button id="clear-all-btn" class="btn btn-outline-danger btn-sm">Clear All</button>
            </div>
            <ul id="saved-addresses-list" class="list-group list-group-flush"></ul>
        </div>
        
    </div>

<script type="module" src="app.js"></script>
</body>
</html>
